[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "dagward"
version = "0.1.0.dev0"
description = "Validate DAG workflows and analyze potential downstream failure impact."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3,<4",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "rich>=13,<15",
    "typer>=0.15,<1",
]

[project.scripts]
dagward = "dagward.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dagward"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/dagward",
    "tests",
    "examples",
    "README.md",
    "pyproject.toml",
    "uv.lock",
    ".python-version",
    ".gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
